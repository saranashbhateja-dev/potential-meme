<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEE OS </title>
<style>
:root{--bg:#f3f4f9;--sf:#fff;--ink:#141726;--mu:#6b7189;--ln:#e0e3ee;--ac:#4f46e5;--p:#2563eb;--c:#059669;--m:#db2777;--soft:#eef0f7;--bad:#d9363e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--sf:#181b2e;--ink:#e8eaf6;--mu:#8f94b3;--ln:#2a2e4a;--ac:#8b83ff;--p:#6e9bff;--c:#34d3a2;--m:#ff72ab;--soft:#20243c;--bad:#ff7a80}}
:root[data-theme="dark"]{--bg:#0f1220;--sf:#181b2e;--ink:#e8eaf6;--mu:#8f94b3;--ln:#2a2e4a;--ac:#8b83ff;--p:#6e9bff;--c:#34d3a2;--m:#ff72ab;--soft:#20243c;--bad:#ff7a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;letter-spacing:-.01em}h1{font-size:22px}h3{font-size:16px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.clk{text-align:right}.clkt{font:700 28px/1.1 ui-monospace,Consolas,"SF Mono",monospace;letter-spacing:.02em}
.mu{color:var(--mu);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);color:var(--mu)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.pill.ok i{background:var(--c)}.pill.off i{background:var(--bad)}.pill.saving i{background:var(--ac)}
nav{display:flex;gap:4px;overflow-x:auto;padding:5px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;position:sticky;top:0;z-index:5;margin-bottom:16px}
nav button{flex:1;white-space:nowrap;border:0;background:none;color:var(--mu);font:600 14px system-ui,sans-serif;padding:9px 12px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:14px}
.grid .card{margin:0}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.big{font-size:34px;font-weight:800;line-height:1.1}.big span{font-size:15px;font-weight:500;color:var(--mu)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;transition:width .3s}
.btn{border:0;background:var(--ac);color:#fff;font:600 13px system-ui,sans-serif;padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.g{background:var(--soft);color:var(--ink);border:1px solid var(--ln)}
.btn.s{padding:4px 10px;font-weight:500;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:6px 14px;border-radius:99px;font:600 13px system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);flex:none;cursor:pointer;padding:0}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.f .w{grid-column:1/-1}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row .t{flex:1;min-width:0}
.row.dn .t{color:var(--mu);text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
details.ch{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--k);border-radius:14px;margin-bottom:8px}
details.ch summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
details.ch summary::-webkit-details-marker{display:none}
details.ch .t{flex:1;min-width:0}details.ch .t b{display:block}
.mini{width:80px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--ln);white-space:nowrap}
.tag.cur{background:var(--ac);color:#fff;border-color:var(--ac)}.tag.ok{color:var(--c);border-color:var(--c)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;align-items:center}
.acts .btn{padding:6px 11px;font-weight:500}
.acts input{flex:1;min-width:200px}
.in{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:16px;padding:0 14px 8px}
.lr{display:flex;align-items:center;gap:9px;padding:6px 0}
.lr label{flex:1;cursor:pointer}
.lr.done label{color:var(--mu);text-decoration:line-through}
.nt{padding:0 14px 12px}
.empty{text-align:center;color:var(--mu);padding:22px 8px}
.err{border-color:var(--bad);color:var(--bad)}.info{border-color:var(--ac)}
.wk{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--mu)}
.wk u{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px}
.late{color:var(--bad);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px}
table.pt{width:100%;border-collapse:collapse;font-size:13px}
table.pt th{text-align:left;color:var(--mu);font-weight:600;padding:6px 8px 6px 0}
table.pt td{padding:7px 8px 7px 0;border-top:1px solid var(--ln);vertical-align:top}
table.pt tr.today td{font-weight:700}
.tw{overflow-x:auto}
.cal,.calh{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{margin-bottom:4px;font-size:11px;font-weight:700;color:var(--mu);text-align:center}
.cd{min-height:66px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:5px 5px 4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit;color:var(--ink);min-width:0}
.cd .dn{font-size:12px;font-weight:700}
.cd.td{outline:2px solid var(--ac);outline-offset:-1px}.cd.rs{background:var(--soft)}.cd.ms{border-top:3px solid var(--bad)}.cd.sl{background:var(--soft);box-shadow:0 0 0 2px var(--ink) inset}
.cd.sun{border-color:color-mix(in srgb,var(--m) 45%,var(--ln));background:color-mix(in srgb,var(--m) 5%,var(--sf))}.cd.ex{background:var(--bad);border-color:var(--bad)}.cd.ex .dn,.cd.ex .b{color:#fff}.cd.en .dn{color:var(--c)}
.dots{display:flex;gap:3px;min-height:9px}
.dt{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;display:inline-block;flex:none}.dt.f{background:currentColor}
.bds{display:flex;gap:3px;flex-wrap:wrap}
.b{font-size:10px;font-weight:700;padding:0 4px;border-radius:6px;background:var(--soft);border:1px solid var(--ln);line-height:15px}
.b.r{background:var(--ac);color:#fff;border-color:var(--ac)}.b.p{opacity:.65}.b.t{background:var(--m);color:#fff;border-color:var(--m)}
.card[id^="m-"]{scroll-margin-top:70px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:48vh;overflow:auto;background:var(--sf);border-top:2px solid var(--ac);box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:20;padding:14px 16px}
.sin{max-width:1000px;margin:0 auto}

/* ---------- v4 visual polish ---------- */
:root{--shadow:0 12px 35px rgba(15,18,32,.08);--radius:18px}
body{background:radial-gradient(circle at 20% -10%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 32%),var(--bg)}
.card,.stat{box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{border-color:color-mix(in srgb,var(--ac) 30%,var(--ln));}
nav{backdrop-filter:blur(14px);box-shadow:0 8px 25px rgba(15,18,32,.07)}
nav button.on{box-shadow:0 5px 15px color-mix(in srgb,var(--ac) 28%,transparent)}
.hero,.test-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 13%,var(--sf)),var(--sf) 60%);border-color:color-mix(in srgb,var(--ac) 22%,var(--ln))}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ac);margin-bottom:5px}
.test-hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:center;padding:20px}
.test-hero h2{margin:0 0 6px;font-size:25px;letter-spacing:-.03em}
.next-test{border:1px solid var(--ln);background:color-mix(in srgb,var(--sf) 65%,var(--soft));border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:3px}
.next-test b{font-size:22px}
.next-test span:last-child{font-size:13px;font-weight:650}
.test-settings{overflow:hidden}.protected-day{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--ln);background:var(--soft);border-radius:12px}.protected-day b{font-size:16px}
.test-setting-head{display:flex;justify-content:space-between;gap:18px;align-items:center}
.test-setting-head h3{font-size:19px}
.sun-badge{min-width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--ac);color:#fff;font-weight:900;letter-spacing:.08em;box-shadow:0 10px 25px color-mix(in srgb,var(--ac) 28%,transparent)}
.test-rules{display:grid;grid-template-columns:1fr;gap:8px;margin-top:15px}
.test-rules span,.test-rule-grid>div{padding:10px 12px;border:1px solid var(--ln);background:var(--soft);border-radius:12px;font-size:12px;font-weight:650}
.test-row-card{padding:14px 0;border-bottom:1px solid var(--ln)}.test-row-card:last-child{border-bottom:0}.test-row-main{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start}.test-row-content{min-width:0}.test-title-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.test-meta-grid{display:grid;grid-template-columns:repeat(5,minmax(72px,1fr));gap:7px}.test-meta-grid>div{padding:8px 9px;border:1px solid var(--ln);background:var(--soft);border-radius:10px;display:flex;flex-direction:column;gap:3px;min-width:0}.test-meta-grid span,.test-detail-label{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--mu)}.test-meta-grid b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.test-detail-block{margin-top:9px}.test-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.test-chip{font-size:11px;padding:5px 8px;border:1px solid var(--ln);background:var(--sf);border-radius:8px;color:var(--tx)}.test-log-btn{align-self:start}.test-order{width:28px;height:28px;border-radius:9px;background:var(--soft);border:1px solid var(--ln);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}.test-row{border-left:3px solid var(--m);padding-left:9px}.cd.sun{position:relative}
.test-guide h3{margin-bottom:10px}
.test-rule-grid{display:grid;grid-template-columns:1fr;gap:10px}
.test-rule-grid>div{display:flex;flex-direction:column;gap:4px}
.test-rule-grid span{color:var(--mu);font-weight:500;line-height:1.45}
@media(max-width:760px){.test-hero{grid-template-columns:1fr}.test-rules,.test-rule-grid{grid-template-columns:repeat(2,1fr)}.test-meta-grid{grid-template-columns:repeat(3,minmax(72px,1fr))}.test-row-main{grid-template-columns:28px minmax(0,1fr)}.test-log-btn{grid-column:2;justify-self:start}}
@media(max-width:560px){.cd{min-height:58px;padding:4px 3px}.b{font-size:9px;padding:0 3px}.test-meta-grid{grid-template-columns:repeat(2,minmax(80px,1fr))}.test-title-line b{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* JEE OS design system refresh — premium, focused, responsive */
:root{
 --bg:#0a0d12;--sf:#111720;--ink:#f3f6fb;--mu:#9aa6b7;--ln:#26313e;
 --ac:#c5f36b;--p:#72c7ff;--c:#9de8bf;--m:#d0b2ff;--soft:#19222d;--bad:#ff8585;
 --radius:20px;--shadow:0 18px 55px rgba(0,0,0,.22);
}
:root[data-theme="light"]{
 --bg:#f4f6f2;--sf:#ffffff;--ink:#18211b;--mu:#647168;--ln:#dfe6df;
 --ac:#3f6e18;--p:#236fa0;--c:#22754b;--m:#7351a8;--soft:#edf2eb;--bad:#b52c38;
}
*{scrollbar-color:#394554 transparent;scrollbar-width:thin}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{
 background:
  radial-gradient(ellipse at 13% -12%,rgba(114,199,255,.09),transparent 32rem),
  radial-gradient(ellipse at 92% 2%,rgba(197,243,107,.075),transparent 28rem),
  var(--bg);
 color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 letter-spacing:-.012em;min-height:100vh;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
.wrap{max-width:1240px;padding:28px 28px 90px}
.top{position:relative;align-items:center;gap:22px;margin:0 0 26px;padding:6px 0 22px;border-bottom:1px solid var(--ln)}
.top h1{font-size:clamp(24px,2.1vw,32px);font-weight:780;letter-spacing:-.055em;line-height:1.1}
.top h1:before{content:"J";display:inline-grid;place-items:center;width:31px;height:31px;margin-right:10px;border-radius:10px;background:var(--ac);color:#11170b;font-size:19px;vertical-align:2px;box-shadow:0 5px 22px color-mix(in srgb,var(--ac) 20%,transparent)}
.mu{font-size:13px;line-height:1.55;color:var(--mu)}
.clk{text-align:left;margin-left:auto;min-width:170px}
.clkt{font:650 24px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:-.045em;color:var(--ink)}
nav{position:sticky;top:10px;z-index:20;display:flex;gap:5px;overflow-x:auto;padding:6px;margin:0 0 28px;border:1px solid color-mix(in srgb,var(--ln) 80%,transparent);border-radius:16px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.12)}
nav button{flex:1;min-width:max-content;padding:11px 16px;border-radius:11px;color:var(--mu);font-size:13px;transition:background .2s,color .2s,transform .2s}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button.on{background:var(--ac);color:#17200d;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 18%,transparent)}
#app{min-height:48vh;animation:app-enter .38s cubic-bezier(.2,.75,.25,1) both}
@keyframes app-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.stat,details.ch{background:linear-gradient(145deg,color-mix(in srgb,var(--sf) 98%,white 2%),var(--sf));border:1px solid var(--ln);border-radius:var(--radius);box-shadow:0 6px 24px rgba(0,0,0,.08);transition:border-color .22s,transform .22s,box-shadow .22s}
.card{padding:22px;margin-bottom:16px}
.grid{gap:16px;margin-bottom:16px}
.grid .card{margin:0}
.card h3{font-size:16px;font-weight:720;letter-spacing:-.025em;margin-bottom:8px}
.hero{position:relative;overflow:hidden;gap:28px;padding:28px;background:linear-gradient(115deg,color-mix(in srgb,var(--sf) 95%,var(--p) 5%),var(--sf));}
.hero:after{content:"";position:absolute;right:-55px;top:-95px;width:260px;height:260px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);box-shadow:0 0 0 24px color-mix(in srgb,var(--ac) 3%,transparent),0 0 0 54px color-mix(in srgb,var(--p) 3%,transparent);pointer-events:none}
.big{font-size:clamp(32px,3vw,44px);font-weight:780;letter-spacing:-.06em;line-height:1.05}
.big span{font-size:14px;letter-spacing:-.01em;color:var(--mu)}
.bar{height:7px;background:color-mix(in srgb,var(--soft) 85%,var(--ln));border-radius:99px}
.bar span{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.progress-ring{width:124px;height:124px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring-color) var(--ring-value),var(--soft) 0);position:relative;box-shadow:0 0 35px color-mix(in srgb,var(--ring-color) 10%,transparent)}
.progress-ring:before{content:"";position:absolute;inset:7px;background:var(--sf);border-radius:50%;border:1px solid var(--ln)}
.progress-ring-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
.progress-ring-inner strong{font-size:27px;letter-spacing:-.06em}
.progress-ring-inner span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:750}
.btn{background:var(--ac);color:#17200d;border-radius:11px;padding:10px 15px;font-size:13px;font-weight:750;transition:transform .18s,filter .18s,box-shadow .18s;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 10%,transparent)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 7px 20px color-mix(in srgb,var(--ac) 16%,transparent)}
.btn:active{transform:translateY(0)}
.btn.g{background:var(--soft);color:var(--ink);border:1px solid var(--ln);box-shadow:none}
.btn.g:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--ln))}
.pill{background:var(--soft);border-color:var(--ln);padding:7px 11px}
.chip{background:var(--sf);border-radius:10px}
.chip.on{background:var(--ac);color:#17200d;border-color:var(--ac)}
input,select,textarea{background:var(--bg);border-radius:11px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 16%,transparent);outline:none}
details.ch{overflow:hidden;margin-bottom:10px;border-left:3px solid var(--k);box-shadow:none}
details.ch[open]{border-color:color-mix(in srgb,var(--k) 65%,var(--ln))}
details.ch summary{padding:17px 18px}
.row{padding:12px 0}
.stat{padding:18px}
.stat b{font-size:28px;letter-spacing:-.045em}
.empty{padding:28px 12px;color:var(--mu)}
.authcard{box-shadow:var(--shadow);border-radius:22px}
.render-error{border-color:var(--bad);max-width:760px;margin:0 auto}
.render-error h2{margin:5px 0 8px;font-size:24px}
.render-error pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--bad);font-size:12px}
.eyebrow{font-size:10px;font-weight:850;letter-spacing:.15em;text-transform:uppercase;color:var(--mu)}
@media(min-width:1000px){#app>.grid:first-of-type{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){
 .wrap{padding:18px 15px 80px}.top{align-items:flex-start;gap:12px;padding-bottom:17px;margin-bottom:18px}
 .top>div:first-child{flex:1 1 100%}.clk{margin-left:0;min-width:0}.clkt{font-size:20px}
 .top .btns{margin-left:auto}.top .authuser{max-width:120px}
 nav{top:6px;margin-bottom:20px;border-radius:14px}nav button{padding:10px 13px}
 .card{padding:17px;border-radius:17px}.hero{gap:18px;padding:20px}.progress-ring{width:94px;height:94px}.progress-ring-inner strong{font-size:22px}
}
@media(max-width:460px){.wrap{padding-inline:11px}.top h1{font-size:23px}.top h1:before{width:27px;height:27px}.hero{align-items:flex-start}.hero .big{font-size:31px}.grid{grid-template-columns:1fr}.card{padding:15px}.btn{padding:9px 12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#app{animation:none}*,*:before,*:after{transition:none!important}}

/* ---------- Final UI pass: premium study command centre ---------- */
:root{--bg:#0b0e18;--sf:#111522;--ink:#f3f4fb;--mu:#9298ac;--ln:#272b3b;--ac:#7658f6;--p:#4d8cff;--c:#26c7a0;--m:#ed5b9a;--soft:#1b2030;--bad:#ff7585;--shadow:0 16px 42px rgba(0,0,0,.24)}
